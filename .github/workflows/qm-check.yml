name: Quality Management Trainer Checks
on:
  push:
    branches: [main, feature/qm-kapitelkataloge]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "index.html"
      - ".github/workflows/qm-check.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run test
      - run: npm run build
